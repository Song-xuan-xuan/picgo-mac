<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 500" width="1220" height="500" role="img" aria-labelledby="t">
  <title id="t">两条入口，同一个核心大脑</title>

  <style>
    text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 10,6; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
  </style>

  <defs>
    <marker id="ah-indigo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#6366f1"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1220" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== 路径 A：应用层 ===== -->
  <rect x="40" y="76" width="466" height="170" rx="10" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-width="2"/>
  <text x="68" y="110" font-size="17" font-weight="700" fill="#4338ca">路径 A：应用层（L7）</text>
  <text x="68" y="140" font-size="13" fill="#475569">Chrome 等主动送包裹</text>
  <text x="68" y="180" font-size="14.5" font-weight="700" fill="#3730a3" class="mono">127.0.0.1:7890</text>
  <text x="196" y="180" font-size="13" fill="#475569">端口</text>
  <text x="68" y="212" font-size="12.5" fill="#6366f1">（HTTP / SOCKS5 协议）</text>

  <path d="M512 161 L548 161" fill="none" stroke="#6366f1" stroke-width="2.5" class="flow" marker-end="url(#ah-indigo)"/>

  <!-- ===== 路径 B：网络层 ===== -->
  <rect x="40" y="300" width="466" height="170" rx="10" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-width="2"/>
  <text x="68" y="334" font-size="17" font-weight="700" fill="#b45309">路径 B：网络层（L3）</text>
  <text x="68" y="364" font-size="13" fill="#475569">路由表强制改道截流</text>
  <text x="68" y="404" font-size="14.5" font-weight="700" fill="#92400e" class="mono">utun4</text>
  <text x="132" y="404" font-size="13" fill="#475569">虚拟网卡</text>
  <text x="68" y="436" font-size="12.5" fill="#b45309">（原始 IP 数据包）</text>

  <path d="M512 385 L548 385" fill="none" stroke="#f59e0b" stroke-width="2.5" class="flow" marker-end="url(#ah-amber)"/>

  <!-- ===== 右侧：同一个核心大脑 ===== -->
  <rect x="552" y="56" width="620" height="414" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="578" y="104" font-size="17" font-weight="700" fill="#0369a1">FlClash（Mihomo）同一个核心大脑</text>
  <line x1="578" y1="122" x2="1146" y2="122" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- 树主干 -->
  <path d="M578 132 L578 406" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 行 1：同一套规则引擎 -->
  <path d="M578 178 H602" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="602" y="150" width="544" height="56" rx="8" fill="#0ea5e9" fill-opacity="0.09" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="626" y="185" font-size="14.5" font-weight="700" fill="#0369a1">同一套规则引擎（Rules）</text>

  <!-- 行 2：校园网 -->
  <path d="M578 254 H602" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="602" y="226" width="544" height="56" rx="8" fill="#10b981" fill-opacity="0.09" stroke="#10b981" stroke-width="2"/>
  <text x="626" y="261" font-size="14.5" font-weight="700" fill="#047857">🏫 校园网 → <tspan class="mono" fill="#065f46">whut</tspan>（<tspan class="mono" fill="#065f46">127.0.0.1:1090</tspan>）</text>

  <!-- 行 3：选择节点 -->
  <path d="M578 330 H602" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="602" y="302" width="544" height="56" rx="8" fill="#8b5cf6" fill-opacity="0.09" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="626" y="318" width="24" height="24" rx="5" fill="#8b5cf6" fill-opacity="0.85"/>
  <text x="662" y="337" font-size="14.5" font-weight="700" fill="#6d28d9">选择节点 → 香港机场</text>

  <!-- 行 4：DIRECT -->
  <path d="M578 406 H602" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="602" y="378" width="544" height="56" rx="8" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2"/>
  <text x="626" y="413" font-size="14.5" font-weight="700" fill="#475569"><tspan class="mono" fill="#334155">DIRECT</tspan> → 物理网卡 <tspan class="mono" fill="#334155">en0</tspan></text>
</svg>
