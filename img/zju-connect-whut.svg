<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" width="1220" height="660" role="img" aria-labelledby="whut-title">
  <title id="whut-title">WHUT 校内网接入架构 — zju-connect + FlClash</title>

  <style>
    text { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
    .flow { stroke-dasharray: 12,6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    .pulse { transform-origin: 535px 235px; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.85; } 50% { opacity:1; } }
    .spin { transform-origin: 535px 235px; animation: spin 14s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    .glow { filter: drop-shadow(0 0 7px rgba(14,165,233,.45)); animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 6px rgba(14,165,233,.35)); }
      50%     { filter: drop-shadow(0 0 13px rgba(14,165,233,.75)); }
    }
    .fade { animation: fade 1.2s ease-out; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .t  { font-size: 14px; font-weight: 700; }
    .s  { font-size: 11px; }
    .xs { font-size: 10px; }
    .hd { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: .5px; }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1220" height="660" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== 标题 ===== -->
  <text x="610" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">
    WHUT 校内网接入 · zju-connect + FlClash
  </text>
  <text x="610" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    一台 Mac，装上就能在校外任何网络访问校内资源 · 1 个后台服务 · 14 MB · 不会掉线
  </text>

  <!-- ===== 列标题 ===== -->
  <g class="hd" text-anchor="middle">
    <text x="114"  y="88">你的应用</text>
    <text x="320"  y="88">两个入口</text>
    <text x="535"  y="88">分流内核</text>
    <text x="760"  y="88">出口</text>
    <text x="1063" y="88">目的地</text>
  </g>

  <!-- ===== 第 1 列：应用 ===== -->
  <g>
    <rect x="24" y="100" width="180" height="264" rx="10" fill="#6366f1" fill-opacity="0.06" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="40" y="116" width="148" height="46" rx="7" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="114" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">浏览器</text>
    <text x="114" y="153" text-anchor="middle" class="xs" fill="#6366f1">Chrome / Safari</text>

    <rect x="40" y="172" width="148" height="46" rx="7" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="114" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">终端</text>
    <text x="114" y="209" text-anchor="middle" class="xs" fill="#6366f1">ssh / curl / scp</text>

    <rect x="40" y="228" width="148" height="46" rx="7" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="114" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">VSCode 远程</text>
    <text x="114" y="265" text-anchor="middle" class="xs" fill="#6366f1">Remote-SSH</text>

    <rect x="40" y="284" width="148" height="46" rx="7" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="114" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Docker 等</text>
    <text x="114" y="321" text-anchor="middle" class="xs" fill="#6366f1">不认代理的程序</text>

    <text x="114" y="352" text-anchor="middle" class="xs" fill="#818cf8">无需任何额外配置</text>
  </g>

  <!-- ===== 第 2 列：入口 ===== -->
  <g>
    <rect x="230" y="108" width="180" height="98" rx="10" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">TUN 虚拟网卡</text>
    <text x="320" y="151" text-anchor="middle" class="s" fill="#d97706">utun4 · 198.18.0.1</text>
    <text x="320" y="170" text-anchor="middle" class="xs" fill="#b45309">网络层 · 系统强制改道</text>
    <text x="320" y="188" text-anchor="middle" class="xs" fill="#b45309">所有程序，一个都跑不掉</text>

    <rect x="230" y="222" width="180" height="98" rx="10" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="320" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">系统代理</text>
    <text x="320" y="265" text-anchor="middle" class="s" fill="#d97706">127.0.0.1:7890</text>
    <text x="320" y="284" text-anchor="middle" class="xs" fill="#b45309">应用层 · 程序自愿遵守</text>
    <text x="320" y="302" text-anchor="middle" class="xs" fill="#b45309">只是"建议"，可关掉</text>

    <text x="320" y="344" text-anchor="middle" class="xs" fill="#94a3b8">两者可只开其一</text>
    <text x="320" y="358" text-anchor="middle" class="xs" fill="#94a3b8">最终分流结果相同</text>
  </g>

  <!-- ===== 第 3 列：FlClash 内核 ===== -->
  <g class="pulse">
    <circle cx="535" cy="235" r="104" fill="none" stroke="#0ea5e9" stroke-opacity="0.35"
            stroke-width="1.5" stroke-dasharray="4,7" class="spin"/>
    <rect x="440" y="120" width="190" height="230" rx="16" fill="#0ea5e9" fill-opacity="0.1"
          stroke="#0ea5e9" stroke-width="3" class="glow"/>
    <text x="535" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#0369a1">FlClash</text>
    <text x="535" y="180" text-anchor="middle" class="s" fill="#0284c7">规则分流内核</text>

    <line x1="460" y1="194" x2="610" y2="194" stroke="#7dd3fc" stroke-width="1"/>

    <text x="460" y="214" class="s" fill="#0369a1">校内资源</text>
    <text x="620" y="214" text-anchor="end" class="xs" fill="#0ea5e9">104 条规则</text>
    <text x="460" y="236" class="s" fill="#0369a1">国际流量</text>
    <text x="620" y="236" text-anchor="end" class="xs" fill="#0ea5e9">订阅自带</text>
    <text x="460" y="258" class="s" fill="#0369a1">国内网站</text>
    <text x="620" y="258" text-anchor="end" class="xs" fill="#0ea5e9">+ 自定义</text>
    <text x="460" y="280" class="s" fill="#0369a1">其余</text>
    <text x="620" y="280" text-anchor="end" class="xs" fill="#0ea5e9">兜底</text>

    <line x1="460" y1="296" x2="610" y2="296" stroke="#7dd3fc" stroke-width="1"/>
    <text x="535" y="316" text-anchor="middle" class="xs" fill="#0284c7">规则从上往下，命中即走</text>
    <text x="535" y="334" text-anchor="middle" class="xs" fill="#0284c7">改配置不用动订阅</text>
  </g>

  <!-- ===== 第 4 列：出口 ===== -->
  <g>
    <!-- whut -->
    <rect x="660" y="112" width="200" height="86" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2.5"/>
    <text x="760" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">校园网</text>
    <text x="760" y="155" text-anchor="middle" class="s" fill="#059669">Socks5 · 127.0.0.1:1090</text>
    <text x="760" y="174" text-anchor="middle" class="xs" fill="#047857">zju-connect 隧道客户端</text>
    <text x="760" y="190" text-anchor="middle" class="xs" fill="#047857">launchd 服务 · 常驻 14 MB</text>

    <!-- 机场 -->
    <rect x="660" y="212" width="200" height="86" rx="10" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
    <text x="760" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">节点</text>
    <text x="760" y="255" text-anchor="middle" class="s" fill="#7c3aed">你的订阅 · 47 个节点</text>
    <text x="760" y="274" text-anchor="middle" class="xs" fill="#6d28d9">香港 / 日本 / 美国 …</text>
    <text x="760" y="290" text-anchor="middle" class="xs" fill="#6d28d9">切换国家在这里改</text>

    <!-- DIRECT -->
    <rect x="660" y="312" width="200" height="66" rx="10" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2"/>
    <text x="760" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">DIRECT</text>
    <text x="760" y="357" text-anchor="middle" class="s" fill="#64748b">不走任何代理</text>
    <text x="760" y="372" text-anchor="middle" class="xs" fill="#64748b">用你自己的网络</text>
  </g>

  <!-- ===== 第 5 列：目的地 ===== -->
  <g>
    <rect x="930" y="112" width="266" height="86" rx="10" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-width="1.8"/>
    <text x="1063" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">校内资源</text>
    <text x="1063" y="155" text-anchor="middle" class="s" fill="#059669">图书馆数据库（96 个域名）</text>
    <text x="1063" y="172" text-anchor="middle" class="xs" fill="#047857">CNKI / IEEE / Elsevier / WoS / Springer …</text>
    <text x="1063" y="188" text-anchor="middle" class="xs" fill="#047857">校内网站 · 内网服务器 · 教务系统</text>

    <rect x="930" y="212" width="266" height="86" rx="10" fill="#8b5cf6" fill-opacity="0.06" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1063" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">国际互联网</text>
    <text x="1063" y="255" text-anchor="middle" class="s" fill="#7c3aed">Google / GitHub / YouTube</text>
    <text x="1063" y="274" text-anchor="middle" class="xs" fill="#6d28d9">出口 IP 会变成节点所在的海外地址</text>
    <text x="1063" y="290" text-anchor="middle" class="xs" fill="#6d28d9">实测出口：103.151.172.152</text>

    <rect x="930" y="312" width="266" height="66" rx="10" fill="#94a3b8" fill-opacity="0.07" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1063" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">国内网站</text>
    <text x="1063" y="357" text-anchor="middle" class="s" fill="#64748b">百度 / B 站 / 淘宝 …</text>
    <text x="1063" y="372" text-anchor="middle" class="xs" fill="#64748b">直连最快，省节点流量</text>
  </g>

  <!-- ===== 连线：应用 → 入口 ===== -->
  <path d="M204 150 Q217 150 230 157" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>
  <path d="M204 250 Q217 250 230 271" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>

  <!-- ===== 连线：入口 → 内核 ===== -->
  <path d="M410 157 Q425 157 440 175" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>
  <path d="M410 271 Q425 271 440 295" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>

  <!-- ===== 连线：内核 → 出口 ===== -->
  <path d="M630 165 Q645 155 660 155" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#ah-green)" class="flow"/>
  <path d="M630 250 Q645 250 660 250" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)" class="flow"/>
  <path d="M630 330 Q645 340 660 345" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>

  <!-- ===== 连线：出口 → 目的地 ===== -->
  <path d="M860 155 Q895 155 930 155" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#ah-green)" class="flow"/>
  <text x="895" y="146" text-anchor="middle" class="xs" fill="#059669">aTrust</text>
  <text x="895" y="170" text-anchor="middle" class="xs" fill="#059669">隧道</text>

  <path d="M860 255 Q895 255 930 255" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)" class="flow"/>
  <text x="895" y="246" text-anchor="middle" class="xs" fill="#7c3aed">加密</text>
  <text x="895" y="270" text-anchor="middle" class="xs" fill="#7c3aed">代理</text>

  <path d="M860 345 Q895 345 930 345" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)" class="flow"/>
  <text x="895" y="336" text-anchor="middle" class="xs" fill="#64748b">直连</text>
  <text x="895" y="360" text-anchor="middle" class="xs" fill="#64748b">出门</text>

  <!-- ===== 底部：三个卖点 ===== -->
  <g>
    <rect x="24" y="400" width="380" height="92" rx="10" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="44" y="428" font-size="14" font-weight="700" fill="#047857">① 在哪都能连</text>
    <text x="44" y="450" class="s" fill="#059669">家 / 公司 / 咖啡厅 / 手机热点</text>
    <text x="44" y="468" class="xs" fill="#047857">只要能访问外网，就能连回校内</text>
    <text x="44" y="484" class="xs" fill="#047857">不用记 IP、不用改路由、不用装证书</text>

    <rect x="420" y="400" width="380" height="92" rx="10" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="440" y="428" font-size="14" font-weight="700" fill="#0369a1">② 不会随时掉线</text>
    <text x="440" y="450" class="s" fill="#0284c7">每 60 秒发一次穿隧心跳</text>
    <text x="440" y="468" class="xs" fill="#0369a1">同时刷新学校网关会话、家里路由器 NAT、运营商连接跟踪</text>
    <text x="440" y="484" class="xs" fill="#0369a1">意外退出 30 秒内自动重启，用缓存凭据重新登录</text>

    <rect x="816" y="400" width="380" height="92" rx="10" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="836" y="428" font-size="14" font-weight="700" fill="#4338ca">③ 只占 14 MB</text>
    <text x="836" y="450" class="s" fill="#6366f1">1 个 launchd 后台服务，没有界面</text>
    <text x="836" y="468" class="xs" fill="#4338ca">无 GUI、无 Electron、无内核扩展、无系统证书</text>
    <text x="836" y="484" class="xs" fill="#4338ca">崩溃/被杀/重启电脑，都会自己回来</text>
  </g>

  <!-- ===== 底部：内存对比 ===== -->
  <rect x="24" y="508" width="1172" height="132" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="534" font-size="13" font-weight="700" fill="#334155">后台开销对比（实测）</text>

  <!-- 现在 -->
  <rect x="44" y="548" width="546" height="74" rx="8" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2"/>
  <text x="62" y="572" font-size="13" font-weight="700" fill="#047857">zju-connect + FlClash（现在）</text>
  <text x="62" y="594" class="s" fill="#059669">后台服务：1 个 · 常驻 14 MB（峰值 24 MB）· CPU 0.0%</text>
  <text x="62" y="612" class="xs" fill="#047857">FlClash 是你要用的代理软件，本来就要开；zju-connect 是它下面的一个节点</text>
  <text x="570" y="580" text-anchor="end" font-size="24" font-weight="700" fill="#059669">14 MB</text>
  <text x="570" y="602" text-anchor="end" class="xs" fill="#059669">1 进程</text>

  <!-- 过去 -->
  <rect x="606" y="548" width="570" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="624" y="572" font-size="13" font-weight="700" fill="#64748b">aTrust 官方客户端（已彻底移除）</text>
  <text x="624" y="594" class="s" fill="#94a3b8">后台进程：10 个 · 常驻 429 MB · 空闲 CPU 9%</text>
  <text x="624" y="612" class="xs" fill="#94a3b8">抢路由表 · 与其它代理冲突 · 长时间无操作后掉线 · 需手动重连</text>
  <text x="1158" y="580" text-anchor="end" font-size="24" font-weight="700" fill="#94a3b8">429 MB</text>
  <text x="1158" y="602" text-anchor="end" class="xs" fill="#94a3b8">10 进程</text>
  <line x1="1030" y1="573" x2="1162" y2="573" stroke="#cbd5e1" stroke-width="2"/>
</svg>
